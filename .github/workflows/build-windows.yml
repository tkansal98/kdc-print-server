name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exes
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KDCPrintServer --collect-submodules pynetdicom kdc_print_server.py
          pyinstaller --noconfirm --onefile --console --name TestPrint --collect-submodules pynetdicom test_send_film.py

      - name: Smoke test (server + test film, no printing)
        shell: pwsh
        run: |
          Copy-Item config.ini dist\
          (Get-Content dist\config.ini) -replace '^port = .*', 'port = 11112' -replace '^ask_paper = .*', 'ask_paper = no' | Set-Content dist\config.ini
          $p = Start-Process dist\KDCPrintServer.exe -ArgumentList '--no-print' -PassThru
          Start-Sleep -Seconds 8
          python test_send_film.py 127.0.0.1 11112 EPSON_A3
          Start-Sleep -Seconds 5
          Stop-Process -Id $p.Id -Force
          Get-Content dist\print_server.log
          if (-not (Get-ChildItem dist\prints -Recurse -Filter *.png)) { throw "No film was produced" }

      - name: Assemble package
        shell: pwsh
        run: |
          $out = "KDC-DICOM-Print-Server"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item dist\KDCPrintServer.exe, dist\TestPrint.exe, config.ini, README.md $out
          Copy-Item windows\*.bat $out
          Compress-Archive -Path "$out\*" -DestinationPath "$out-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: KDC-DICOM-Print-Server-windows
          path: KDC-DICOM-Print-Server/

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: KDC DICOM Print Server ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **KDC-DICOM-Print-Server-windows.zip**, unzip to e.g. C:\KDC-Print,
            set the printer name in config.ini, run install.bat as administrator, then TestPrint.exe.
          files: KDC-DICOM-Print-Server-windows.zip
