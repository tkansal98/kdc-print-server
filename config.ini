; KDC DICOM Print Server settings. Restart the server after changing.

[dicom]
; Main AE title. The CT can also send to any AE title listed under [paper_by_ae]
; (max 16 characters each)
ae_title = EPSON_A3
; Must match "Port number" on the CT printer screen
port = 104
; yes = reject jobs sent to any other AE title (useful to catch typos)
require_called_ae = no

[printer]
; Exact Windows printer name, e.g. EPSON L18050 Series. Blank = Windows default printer
name =
; Default paper when no rule below matches.
; 13X17, 14X17, A3, A4, A3+, 11X17, LETTER, or CUSTOM (then fill in the two sizes below)
paper = 13X17
paper_width_mm =
paper_height_mm =
; yes = tell the Epson driver the paper size on every print.
; no  = use whatever size is set as default in the Epson printer preferences
set_paper_size = yes
; auto = follow the CT's portrait/landscape setting; or portrait / landscape
orientation = auto
; no = only save images to the prints folder
auto_print = yes
; safety cap on copies requested by the CT
max_copies = 5

[paper_by_ae]
; Add one printer entry on the CT per paper, all with the same IP and port but a
; different AE title. A job sent to that AE title prints on that paper.
EPSON_13X17 = 13X17
EPSON_A4 = A4

[paper_by_film_size]
; If the AE title isn't listed above, the film size chosen on the CT decides.
14INX17IN = 13X17
A4 = A4
8INX10IN = A4
8_5INX11IN = A4
A3 = A3

[page]
dpi = 300
; black = film look. white = saves ink in the margins and gaps
background = black
; extra margin inside the printer's own unprintable border
margin_mm = 1
gap_mm = 1.5
; Printed at the top-left of every film. Leave blank for none
header_text = Kansal Diagnostic Centre, Amritsar
header_height_mm = 7
show_datetime = yes

[output]
; A copy of each film is kept here, one folder per day
folder = prints
save_png = yes
save_pdf = no
; Delete saved copies older than this many days (0 = keep forever)
keep_days = 30
